name: CI Pipeline
on:
  push:
    branches: feature/ci-cd

concurrency:
  group: quickbite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: 
  contents: read



jobs:
 ## ********* Git LEak Test ***************##

  Secret_Scan:
    name: GitLeaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
           fetch-depth: 0

      # Run GitLeaks
      - name: Run GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      


 ## ********* BAckend TEST ***************##

  backend-test:
    name: backend Test
    runs-on: ubuntu-latest

    defaults:
      run: 
        working-directory: backend
    
    steps:
      - name: Checkout Repositroy
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --check server.js
        continue-on-error: false

## ***** Docker hadolint ***** ##

  dockerfile-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Hadolint Frontend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.frontend
          failure-threshold: error

      - name: Hadolint Backend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.backend
          failure-threshold: error
  

    ## *****  Docker Build ***** ##
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend-test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      # - name: Set image tag
      #   run: |
      #    echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"    

      - name: Build backend image
        run: | 
          docker build \
          --file ./Dockerfile.backend \
          --tag ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-backend:test .
         # # --tag ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-backend:${IMAGE_TAG} \
         # # .

      - name: Build frontend image
        run: | 
          docker build \
          --file ./Dockerfile.frontend \
          --tag ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-frontend:test .
        #  # --tag ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-frontend:${IMAGE_TAG} \
        #  # .
      - name: Check Docker images
        run: docker images

## ***** Security Scan ***** ##
  security_scan:
    name: Container Security Scan
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -f Dockerfile.backend \
            -t quickbite-backend:scan .

      - name: Build frontend image
        run: |
          docker build \
            -f Dockerfile.frontend \
            -t quickbite-frontend:scan .

## Scaning Image with Critical severity
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1


      - name: Scan backend image
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            quickbite-backend:scan

      - name: Scan frontend image
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            quickbite-frontend:scan

# Build and push to the Docker Hub
  Build-and-push:
    name: Image Push to DockerHub
    runs-on: ubuntu-latest

    needs:
      - security_scan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -f Dockerfile.backend \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-backend:latest .

          docker build \
           --file Dockerfile.backend \
           --tag ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-backend:${IMAGE_TAG} \
           .
      - name: Build frontend image
        run: |
          docker build \
            -f Dockerfile.frontend \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-frontend:latest .
 
          docker build \
           --file Dockerfile.frontend \
           --tag ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-frontend:${IMAGE_TAG} \
           .

     
      # Push images
     
      - name: Push backend images
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-backend:latest

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-backend:${IMAGE_TAG}

      - name: Push frontend images
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-frontend:latest

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-frontend:${IMAGE_TAG}