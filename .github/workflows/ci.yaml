name: CI Pipeline
on:
  push:
    branches:
      - feature/ci-cd
    paths-ignore:
      - 'k8s/**'

concurrency:
  group: quickbite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: 
  contents: read

env:
  NODE_VERSION: "20"



jobs:
 ## ********* Git LEak Test ***************##

  secret-scan:
    name: GitLeaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
           fetch-depth: 0

      # Run GitLeaks
      - name: Run GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      
## *********** Backend: Install, Lint, Test, Audit *********** ##
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

# Install
      - name: Install dependencies
        run: npm ci
 
      - name: Syntax check
        run: node --check server.js

# Lint 
        
      - name: Lint
        run: npm run lint --if-present

# TEST

      - name: Unit tests
        run: npm test --if-present
 
      - name: Dependency audit (high+ severity, prod deps)
        run: npm audit --omit=dev --audit-level=high


## ***** Dockerfile lint ***** ##

  dockerfile-lint:
    name: Hadolint (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
          - name: frontend
            dockerfile: Dockerfile.frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
 
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning

## ***** Security Scan ***** ##
  security_scan:
    name: Build & Trivy Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ secret-scan, backend-test, dockerfile-lint ]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
          - name: frontend
            dockerfile: Dockerfile.frontend
    
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Buildx          
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: quickbite-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

# Report everything (HIGH+CRITICAL) to the Security tab without failing

      - name: Trivy report (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0 #setup-trivy@v0.3.1
        with:
          image-ref: quickbite-${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
 
      - name: Upload SARIF
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.name)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

 # Gate: fail the build on fixable CRITICAL vulnerabilities

      - name: Trivy gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0 #setup-trivy@v0.3.1
        with:
          image-ref: quickbite-${{ matrix.name }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # 6. Push to Docker Hub
  
  build-and-push:
    name: Push ${{ matrix.name }} to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [security_scan]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
          - name: frontend
            dockerfile: Dockerfile.frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-${{ matrix.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=quickbite-${{ matrix.name }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          # provenance: mode=max ## Add details or info about the image 
          # sbom: true

# This stage is for that this docker image is proof of this repo

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/quickbite-${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  pipeline-summary:
    name: "📊 Pipeline Report"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [secret-scan, backend-test, dockerfile-lint, security_scan, build-and-push]
    steps:
      - name: 📊 Write report
        env:
          R_SECRET: ${{ needs.secret-scan.result }}
          R_BACKEND: ${{ needs.backend-test.result }}
          R_LINT: ${{ needs.dockerfile-lint.result }}
          R_SCAN: ${{ needs.security_scan.result }}
          R_PUSH: ${{ needs.build-and-push.result }}
        run: |
          icon() {
            case "$1" in
              success)   echo "✅ passed" ;;
              failure)   echo "❌ failed" ;;
              cancelled) echo "⚪ cancelled" ;;
              skipped)   echo "⏭️ skipped" ;;
              *)         echo "❔ $1" ;;
            esac
          }
          {
            echo "## 🚀 QuickBite CI · Pipeline Report"
            echo ""
            echo "**Branch:** \`${GITHUB_REF_NAME}\` · **Commit:** \`${GITHUB_SHA::7}\` · **By:** @${GITHUB_ACTOR}"
            echo ""
            echo "| Stage | Job | Result |"
            echo "|---|---|---|"
            echo "| 1 · Checks | 🔐 Secret Scan | $(icon "$R_SECRET") |"
            echo "| 1 · Checks | 🧪 Backend Test | $(icon "$R_BACKEND") |"
            echo "| 1 · Checks | 🧹 Dockerfile Lint | $(icon "$R_LINT") |"
            echo "| 2 · Security | 🐳 Build & Trivy Scan | $(icon "$R_SCAN") |"
            echo "| 3 · Release | 🚀 Push to Docker Hub | $(icon "$R_PUSH") |"
          } >> "$GITHUB_STEP_SUMMARY"


          